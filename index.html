<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhijit Mahata | Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-red: #FF0000;
            --deep-space: radial-gradient(circle at top, #1a2a6c, #b21f1f, #fdbb2d); /* Backup Gradient */
            --space-grad: linear-gradient(180deg, #0f172a 0%, #020617 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-white: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--space-grad);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* --- Profile Section --- */
        .profile-container {
            margin-bottom: 30px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #222;
            margin: 0 auto 15px;
            border: 3px solid var(--primary-red);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Keeps image aspect-ratio intact when cropping to circle */
        }

        .profile-img i {
            font-size: 3rem;
            color: #444;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .bio {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 300;
            margin-bottom: 35px;
        }

        /* --- Buttons --- */
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 25px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .link-card:hover {
            transform: scale(1.03);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-red);
        }

        .link-card i {
            font-size: 1.4rem;
            width: 35px;
            margin-right: 15px;
            text-align: center;
        }

        .link-card span {
            font-weight: 500;
            font-size: 1rem;
        }

        /* Platform specific icons */
        .fa-steam { color: #4682B4; }
        .fa-instagram { color: #e1306c; }
        .fa-indian-rupee-sign { color: #00baf2; } /* Styled to UPI/Paytm Cyan */
        .fa-discord { color: #5865F2; }
        .fa-facebook { color: #1877F2; }

        /* --- Footer --- */
        footer {
            margin-top: 50px;
            padding-bottom: 20px;
        }

        .payment-note {
            font-size: 0.75rem;
            color: #475569;
            margin-bottom: 15px;
        }

        .payment-note i {
            margin-right: 5px;
        }

        .copyright {
            font-size: 0.7rem;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-container">
        <div class="profile-img">
            <img src="img001.png" alt="Abhijit Mahata">
        </div>
        <h1>Abhijit Mahata</h1>
        <p class="bio">Student | Video Editor | Pro Gamer</p>
    </div>

    <div class="links-group">
        <a href="http://steam.abhijitmahata.in" target="_blank" class="link-card">
            <i class="fab fa-steam"></i>
            <span>Steam</span>
        </a>

        <a href="http://facebook.abhijitmahata.in" target="_blank" class="link-card">
            <i class="fab fa-facebook"></i>
            <span>Facebook</span>
        </a> 
        
        <a href="http://instagram.abhijitmahata.in" target="_blank" class="link-card">
            <i class="fab fa-instagram"></i>
            <span>Instagram</span>
        </a> 

        <a href="upi://pay?pa=8346056125@ybl&pn=ABHIJITMAHATA" class="link-card" style="border: 1px solid rgba(255, 0, 0, 0.3);">
            <i class="fas fa-indian-rupee-sign"></i>
            <span>Pay Through UPI</span>
        </a>

        <a href="https://discord.gg/2q98Kkr2eE" target="_blank" class="link-card">
            <i class="fab fa-discord"></i>
            <span>Join My Discord Server</span>
        </a>
    </div>

    <footer>
        <p class="payment-note">
            <i class="fas fa-shield-alt"></i> Secure payments via PhonePe / UPI 
        </p>
        <p class="copyright">&copy; 2026 ABHIJIT MAHATA</p>
    </footer>
</div>

</body>
</html>
